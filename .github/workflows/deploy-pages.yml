# Builds the browser-only version of the scheduler and publishes it to
# GitHub Pages on every push to main (or when run by hand from the Actions tab).
# One-time setup: repository Settings > Pages > Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install the web app's packages
        run: bun install --filter @template/web
      - name: Build the browser-only version
        working-directory: packages/web
        run: bun run build:hosted
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist-hosted

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
